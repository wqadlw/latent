[project]
name = "ai-content-matrix"
version = "3.0.0"
description = "面向品牌内容运营团队的 AI 内容生产矩阵与 GEO 作战平台"
requires-python = ">=3.9"
license = { text = "MIT" }

# 依赖清单的唯一事实来源仍是 backend/requirements*.txt（便于 PyInstaller 打包脚本复用）。
# 此处只声明项目元信息与工具链配置。

# ============================================================
#  Ruff —— 代码检查与格式化
#  安装：pip install ruff
#  检查：ruff check .
#  修复：ruff check --fix .
# ============================================================
[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [
    "backend/venv",
    "backend/alembic/versions",   # 迁移文件由 alembic 生成，不强制风格
    "frontend",
]

[tool.ruff.lint]
# 规则集取舍原则：只开「能真实抓到缺陷」的规则，不开「会强迫翻动全仓风格」的规则。
# 历史代码里大量 typing.Dict / typing.List（UP006/UP035）是**刻意保留**的 ——
# 项目要兼容 Python 3.9，而 `dict[str, X]` 作为运行时注解需要
# `from __future__ import annotations` 或 3.10+。因此 UP 类规则整体不开。
select = [
    "F",    # pyflakes：未使用导入/变量、未定义名称（真实缺陷）
    "E4",   # 导入相关
    "E7",   # 语句相关（含 E711「与 None 比较」）
    "E9",   # 运行时错误
    "W",    # pycodestyle 警告
    "B",    # flake8-bugbear：易错写法
    "C4",   # flake8-comprehensions
    "I",    # isort：导入排序
]
ignore = [
    "E501",   # 行长由 formatter 控制
    "B008",   # FastAPI 的 Depends() 作默认参数是标准用法
    "E702",   # 遗留代码存在单行多语句，不值得为风格翻动全仓
    "E401",   # 同上：单行多导入
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]        # conftest 必须在导入 app 前设置环境变量
"backend/alembic/env.py" = ["E402"] # 同上：sys.path 注入后才能 import app

# ============================================================
#  pytest —— 测试与覆盖率
#  运行：cd backend && venv/Scripts/python.exe -m pytest
#  覆盖率：... -m pytest --cov=app --cov-report=term-missing
# ============================================================
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "backend/app/main.py",        # 入口，靠端到端验证覆盖
    "backend/alembic/*",
]

[tool.coverage.report]
# 覆盖率门槛：核心安全模块必须高覆盖，整体暂设 45%（历史代码尚未补测）
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
