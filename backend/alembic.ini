# ============================================================
#  Alembic configuration -- database schema versioning
#
#  Replaces the ~400 lines of hand-written migration code that used to live in
#  app/main.py::init_db() (PRAGMA table_info -> ALTER TABLE -> RENAME ->
#  INSERT SELECT, all wrapped in bare `except: pass`).
#
#  NOTE: this file must stay ASCII-only. Python's configparser reads .ini files
#  with the *locale* encoding on Windows (GBK on zh-CN systems), so non-ASCII
#  comments here crash startup with UnicodeDecodeError.
#  See docs in UPGRADE-V3.md for the full rationale (in Chinese).
#
#  Usage (from backend/, with venv activated):
#    venv/Scripts/python.exe -m alembic revision --autogenerate -m "message"
#    venv/Scripts/python.exe -m alembic upgrade head
#    venv/Scripts/python.exe -m alembic downgrade -1
#    venv/Scripts/python.exe -m alembic current
# ============================================================
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os

# The real connection string is injected dynamically by alembic/env.py
# from app.database.DB_PATH, so it works for both source and frozen modes.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
